name: Demo Apps

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - "demos/**"
      - "src/**"

concurrency:
  group: demos-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  validate-demo:
    strategy:
      fail-fast: false
      matrix:
        demo:
          - name: fastapi-catalog
            dir: demos/fastapi-catalog
          - name: flask-blog
            dir: demos/flask-blog
          - name: ttl-sessions
            dir: demos/ttl-sessions
          - name: batch-importer
            dir: demos/batch-importer
    runs-on: ubuntu-latest
    name: ${{ matrix.demo.name }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ matrix.demo.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Syntax check (py_compile)
        run: |
          find . -name '*.py' -print -exec uv run python -m py_compile {} \;
