name: Integration Tests

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/test-integration.yml"
  repository_dispatch:
    types: [trigger-main-ci]

concurrency:
  group: integration-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test-integration:
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
        driver-type:
          - scylla
          - cassandra
          - acsylla
          - python-rs
        exclude:
          - python-version: "3.12"
            driver-type: scylla
          - python-version: "3.12"
            driver-type: acsylla
          - python-version: "3.12"
            driver-type: python-rs
          - python-version: "3.14"
            driver-type: cassandra
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies
        run: |
          uv sync --all-groups
          uv pip install -e ".[${{ matrix.driver-type }}]"
      - name: Run integration tests
        run: uv run pytest -m integration -v --timeout=120 --driver-type=${{ matrix.driver-type }} --cov-report=xml --junitxml=junit.xml -o junit_family=legacy
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: integration
          # fail loudly on master; PR uploads only warn so a Codecov hiccup doesn't redden the matrix
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          flags: integration
