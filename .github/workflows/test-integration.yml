name: Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/test-integration.yml"
  repository_dispatch:
    types: [trigger-main-ci]

concurrency:
  group: integration-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test-integration:
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
        driver-type:
          - scylla
          - cassandra
          - acsylla
          - python-rs
        exclude:
          - python-version: "3.12"
            driver-type: scylla
          - python-version: "3.12"
            driver-type: acsylla
          - python-version: "3.12"
            driver-type: python-rs
          - python-version: "3.14"
            driver-type: cassandra
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies
        run: |
          uv sync --all-groups
          uv pip install -e ".[${{ matrix.driver-type }}]"
      - name: Run integration tests
        run: uv run pytest -m integration -v --timeout=120 --driver-type=${{ matrix.driver-type }}
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: integration
