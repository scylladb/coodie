name: CI

on:
  push:
    branches:
      - master
  pull_request:
  repository_dispatch:
    types: [trigger-main-ci]

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Install Dependencies
        run: uv sync --all-groups
      - name: Run pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

  # Make sure commit messages follow the conventional commits convention:
  # https://www.conventionalcommits.org
  commitlint:
    name: Lint Commit Messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1

  # Release flow (release-PR, same idea as scylladb/cqlsh-rs):
  #   1. Every push to master creates/updates a "chore(release): vX.Y.Z" PR
  #      on branch release/next with the CHANGELOG.md entry.
  #   2. Merging that PR (rebase or squash) is what cuts the release: the
  #      release job sees the chore(release) head commit, tags it, creates
  #      the GitHub Release, and the jobs below publish to PyPI.
  #
  # The release PR is opened with GITHUB_TOKEN, so pull_request workflows
  # don't run on it; the test workflows are dispatched on release/next instead
  # and their checks show up on the PR.
  release-pr:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && !startsWith(github.event.head_commit.message, 'chore(release):')
    needs:
      - lint
      - commitlint

    permissions:
      contents: write
      pull-requests: write
      actions: write

    concurrency:
      group: release-pr
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Only computes the next version and writes CHANGELOG.md
      - name: Python Semantic Release (dry)
        id: semrel
        uses: python-semantic-release/python-semantic-release@b700dbeb1f431a0fcc30a79f3f0869407fe07278 # v10.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build: "false"
          commit: "false"
          tag: "false"
          push: "false"
          vcs_release: "false"

      # No-op when there is nothing to release (no CHANGELOG.md diff)
      - name: Create/update release PR
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: release/next
          commit-message: "chore(release): ${{ steps.semrel.outputs.tag }}"
          title: "chore(release): ${{ steps.semrel.outputs.tag }}"
          body: |
            Merging this PR releases `${{ steps.semrel.outputs.tag }}` to PyPI.
            It is updated automatically on every push to master; see CHANGELOG.md diff for contents.
          add-paths: CHANGELOG.md
          delete-branch: true

      # PRs opened by GITHUB_TOKEN don't trigger workflows, but dispatches do.
      # Run the full test suite on the release PR head before it's merged.
      - name: Run tests on the release PR
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for wf in test-unit.yml test-integration.yml test-demos.yml; do
            gh workflow run "$wf" --ref release/next
          done

  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && startsWith(github.event.head_commit.message, 'chore(release):')
    needs:
      - lint
      - commitlint

    permissions:
      contents: write

    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false

    outputs:
      released: ${{ steps.semrel.outputs.released }}
      version: ${{ steps.semrel.outputs.version }}
      tag: ${{ steps.semrel.outputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # CHANGELOG.md was already updated by the release PR:
      # - Create git tag
      # - Create GitHub Release
      - name: Python Semantic Release
        id: semrel
        uses: python-semantic-release/python-semantic-release@b700dbeb1f431a0fcc30a79f3f0869407fe07278 # v10.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build: "false"
          commit: "false"
          changelog: "false"

  build:
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.released == 'true'

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Build package
        run: uv build

      - name: Store the distribution packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs:
      - release
      - build
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest

    environment: release

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
