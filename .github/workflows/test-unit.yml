name: Unit Tests

on:
  push:
    branches:
      - master
  pull_request:
  repository_dispatch:
    types: [trigger-main-ci]

concurrency:
  group: unit-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test-unit:
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies
        run: |
          uv sync --all-groups
          uv pip install -e ".[scylla]"
      - name: Install bats (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run unit tests
        run: uv run pytest -m "not integration" --cov-report=xml --junitxml=junit.xml -o junit_family=legacy
      - name: Run plan parser tests (Linux only)
        if: runner.os == 'Linux'
        run: uv run pytest .github/scripts/test_parse_plan.py --no-cov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # fail loudly on master; PR uploads only warn so a Codecov hiccup doesn't redden the matrix
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
