name: Docs

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: docs-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Install Dependencies
        run: uv sync --group docs
      - name: Build docs
        run: uv run sphinx-build -b html docs/source docs/build/html
      - name: Include benchmark history from gh-pages
        if: github.ref == 'refs/heads/master'
        run: |
          git fetch origin gh-pages 2>/dev/null || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git checkout origin/gh-pages -- benchmarks/ 2>/dev/null || true
            if [ -d benchmarks ]; then
              mkdir -p docs/build/html/benchmarks
              cp -rT benchmarks/ docs/build/html/benchmarks/
              echo "✅ Benchmark history included in docs deployment"
            else
              echo "ℹ️ No benchmark data found on gh-pages branch"
            fi
          else
            echo "ℹ️ gh-pages branch not found, skipping benchmark history"
          fi

      - name: Upload artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/build/html

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
